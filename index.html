/* ────────────────────────────────────────────────────────────
   Pension Consulting — 3층 연금 설계
   국민연금 / 퇴직연금 / 개인연금 / 연금컨설팅 / 퇴직소득세 / 챗봇
   ──────────────────────────────────────────────────────────── */

const C = {

const PRETENDARD =
  "'Pretendard Variable', Pretendard, -apple-system, BlinkMacSystemFont, system-ui, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif";
const FONT_UI = PRETENDARD;
const FONT_DISPLAY = PRETENDARD;

/* ── 숫자/날짜 유틸 ───────────────────────────────────────── */
const toNum = (v) => {
  const n = parseFloat(String(v ?? "").replace(/,/g, ""));
  return isNaN(n) ? 0 : n;
};
const comma = (v) => (v === "" || v === null || v === undefined ? "" : Number(v).toLocaleString("ko-KR"));
const won = (n) => Math.round(n || 0).toLocaleString("ko-KR") + "원";
const big = (n) => {
  n = Math.round(n || 0);
  if (n >= 1e8) {
    const eok = Math.floor(n / 1e8);
    const man = Math.round((n % 1e8) / 1e4);
    return man > 0 ? eok + "억 " + man.toLocaleString() + "만원" : eok + "억원";
  }
  if (n >= 1e4) return Math.round(n / 1e4).toLocaleString() + "만원";
  return n.toLocaleString() + "원";
};

const TODAY = new Date();
// 앱 상단의 "기준일" 값. 렌더링 시작 시 App이 갱신하고, 모든 계산이 이 날짜를 오늘로 봄
let NOW = TODAY;
const D = (s) => {
  if (!s) return null;
  const d = new Date(s + "T00:00:00");
  return isNaN(d.getTime()) ? null : d;
};
const iso = (d) => d.toISOString().slice(0, 10);
const daysBetween = (a, b) => Math.round((b - a) / 86400000);
// 달력 기준 연수 — 응당일이면 정확히 정수로 떨어짐 (윤년 오차 없음)
const yearsBetween = (a, b) => {
  let y = b.getFullYear() - a.getFullYear();
  const anniv = new Date(a);
  anniv.setFullYear(a.getFullYear() + y);
  if (anniv > b) {
    y -= 1;
    anniv.setFullYear(anniv.getFullYear() - 1);
  }
  const next = new Date(anniv);
  next.setFullYear(anniv.getFullYear() + 1);
  return y + (b - anniv) / (next - anniv);
};
// 만근 기준 개월수 — 일자를 무시하고 입·퇴사한 달을 통째로 셈
const fullMonths = (a, b) =>
  (b.getFullYear() * 12 + b.getMonth()) - (a.getFullYear() * 12 + a.getMonth()) + 1;
const monthsBetween = (a, b) => {
  let m = (b.getFullYear() - a.getFullYear()) * 12 + (b.getMonth() - a.getMonth());
  if (b.getDate() < a.getDate()) m -= 1;
  return m;
};
const ym = (years) => {
  const y = Math.floor(years + 1e-9);
  let m = Math.floor((years - y) * 12 + 1e-9);
  return m >= 12 ? y + 1 + "년 0개월" : y + "년 " + m + "개월";
};
const addMonths = (d, m) => {
  const n = new Date(d);
  n.setMonth(n.getMonth() + m);
  return n;
};
const addYears = (d, y) => {
  const n = new Date(d);
  n.setFullYear(n.getFullYear() + Math.floor(y));
  return n;
};

/* ── 금융 계산 ────────────────────────────────────────────── */
const mRate = (annualPct) => Math.pow(1 + annualPct / 100, 1 / 12) - 1;

// 적립: 현재잔액 + 매월납입의 미래가치
function futureValue(current, monthlyPay, years, ratePct) {
  const n = Math.max(0, Math.round(years * 12));
  const r = mRate(ratePct);
  const fvNow = current * Math.pow(1 + r, n);
  const fvPay = r > 0 ? monthlyPay * ((Math.pow(1 + r, n) - 1) / r) : monthlyPay * n;
  return fvNow + fvPay;
}
// 보험연금 · 확정연금(기수불) — 연금액 = 적립금 ÷ [(1 − 1/(1+i)^n) ÷ (1 − 1/(1+i))]
function annuityCertain(lump, years, ratePct) {
  const n = Math.max(1, Math.round(years));
  const i = ratePct / 100;
  if (i <= 0) return { yearly: lump / n, monthly: lump / n / 12, factor: n };
  const v = 1 / (1 + i);
  const factor = (1 - Math.pow(v, n)) / (1 - v);
  return { yearly: lump / factor, monthly: lump / factor / 12, factor };
}

// 인출: 적립액을 N년간 나눠 받을 때 월 수령액
function monthlyFromLump(lump, years, ratePct) {
  const n = Math.max(1, Math.round(years * 12));
  const r = mRate(ratePct);
  return r > 0 ? (lump * r) / (1 - Math.pow(1 + r, -n)) : lump / n;
}
// 역산: 월 X원을 N년간 받으려면 개시시점에 필요한 재원
function lumpFromMonthly(monthly, years, ratePct) {
  const n = Math.max(1, Math.round(years * 12));
  const r = mRate(ratePct);
  return r > 0 ? (monthly * (1 - Math.pow(1 + r, -n))) / r : monthly * n;
}
// 역산: 목표 재원을 만들기 위한 월 납입액
function monthlyToReach(target, years, ratePct) {
  const n = Math.max(1, Math.round(years * 12));
  const r = mRate(ratePct);
  const factor = r > 0 ? (Math.pow(1 + r, n) - 1) / r : n;
  return target / factor;
}
// 연금소득세율(사적연금, 수령 개시나이 기준)
const pensionTaxRate = (age) => (age >= 80 ? 3.3 : age >= 70 ? 4.4 : 5.5);

/* ── 국민연금 ─────────────────────────────────────────── */
// 출생연도별 노령연금 수급개시연령
function npStartAge(birthYear) {
  if (birthYear <= 1952) return 60;
  if (birthYear <= 1956) return 61;
  if (birthYear <= 1960) return 62;
  if (birthYear <= 1964) return 63;
  if (birthYear <= 1968) return 64;
  return 65;
}
// 가입 연도별 소득대체율 상수 (1999~2007: 1.8 / 2008~2027: 매년 0.015 감소 / 2028~: 1.2)
const rateConst = (y) => (y >= 2028 ? 1.2 : y <= 2007 ? 1.8 : 1.5 - 0.015 * (y - 2008));

function calcNP(np) {
  const A = toNum(np.aValue) || 3089062;
  const rate = 0.09;
  const paidM = Math.round(toNum(np.paidMonths));
  const paidAmt = toNum(np.paidAmount);
  const income = toNum(np.income);
  const birth = D(np.birth);

  // 기준소득월액 상·하한 적용
  const cap = toNum(np.cap) || 6590000;
  const floorAmt = toNum(np.floor) || 410000;
  const capped = income > cap;
  const belowFloor = income > 0 && income < floorAmt;
  const incomeUsed = income <= 0 ? 0 : Math.min(Math.max(income, floorAmt), cap);

  // 납부 종료 시점 — 공단은 60세까지 납부를 가정
  const age60 = birth ? addYears(birth, 60) : null;
  const useAge60 = np.endBasis !== "retire";
  const end = useAge60 ? age60 : D(np.endDate);

  const futureM = end ? Math.max(0, fullMonths(NOW, end)) : 0; // 조회한 달과 도달한 달을 모두 포함
  const monthlyPrem = incomeUsed * rate;
  const totalM = paidM + futureM;

  // 현재가치 기준 — 소득이 지금 수준에 머문다고 보는 금액 (연금액 산정용)
  const totalAmt = paidAmt + monthlyPrem * futureM;

  // 미래가치 기준 — 소득이 매년 오른다고 보는 금액 (공단 조회값과 같은 방식)
  const g = toNum(np.growth) / 100;
  let futureAmt = 0;
  for (let k = 0; k < futureM; k++) futureAmt += monthlyPrem * Math.pow(1 + g, k / 12);
  const totalAmtFV = paidAmt + futureAmt;
  const lastPrem = monthlyPrem * Math.pow(1 + g, futureM / 12);

  // ── B값(가입기간 평균 기준소득월액) ──
  // 과거: 납부보험료에서 역산(또는 직접 입력) → 상한 적용
  // 미래: 현재 소득이 소득상승률로 오르되 상한에서 멈춤
  const pastRaw = paidM > 0 ? paidAmt / paidM / rate : 0;
  const pastAvg = Math.min(toNum(np.pastAvg) > 0 ? toNum(np.pastAvg) : pastRaw, cap);
  // 미래분은 현재 소득이 유지된다고 봄 (현재가치 기준) — 소득상승률은 납입보험료 대조용
  const futAvg = incomeUsed;
  const futSum = futAvg * futureM;
  const Bcalc = totalM > 0 ? (paidM * pastAvg + futSum) / totalM : 0;
  const B = toNum(np.bValue) > 0 ? toNum(np.bValue) : Bcalc;
  // 월별로 가입 연도의 상수를 적용해 가중평균
  let cSum = 0;
  const pStart = addMonths(NOW, -paidM);
  for (let k = 0; k < paidM; k++) cSum += rateConst(addMonths(pStart, k).getFullYear());
  for (let k = 0; k < futureM; k++) cSum += rateConst(addMonths(NOW, k).getFullYear());
  const konst = totalM > 0 ? cSum / totalM : 1.2;

  let yearly = konst * (A + B);
  if (totalM >= 240) yearly *= 1 + (0.05 * (totalM - 240)) / 12;
  else yearly *= totalM / 240;
  const monthly = totalM >= 120 ? yearly / 12 : 0; // 최소 가입기간 10년

  const bYear = birth ? birth.getFullYear() : 1985;
  const startAge = npStartAge(bYear);
  return {
    paidM, paidAmt, futureM, totalM, totalAmt, totalAmtFV, lastPrem, monthlyPrem, B, Bcalc, pastRaw, pastAvg, futAvg,
    monthly, startAge, konst, cap, floorAmt, capped, belowFloor, incomeUsed, useAge60, end,
    A,
    startDate: birth ? addYears(birth, startAge) : null,
    eligible: totalM >= 120,
  };
}

/* ── 퇴직연금 ─────────────────────────────────────────── */
function calcRP(rp) {
  const join = D(rp.join);
  const retire = D(rp.retire);
  const out = { type: rp.type, lump: 0, days: 0, years: 0, detail: {} };
  if (!join || !retire || retire <= join) return out;

  // 근속기간은 월 단위 만근 — 월중 언제 입·퇴사해도 그 달을 1개월로 셈
  out.days = daysBetween(join, retire);
  out.months = Math.max(0, fullMonths(join, retire));
  out.years = out.months / 12;

  if (rp.type === "DB") {
    const pay = toNum(rp.salary);
    const bonus = toNum(rp.bonus);
    const monthlyAvg = pay + bonus / 12; // 1개월분 평균임금
    out.lump = monthlyAvg * out.years;
    out.detail = { monthlyAvg, pay, bonus };
  } else {
    const cur = toNum(rp.curAnnual);
    const endA = toNum(rp.endAnnual);
    const r = toNum(rp.rate);
    const bal = toNum(rp.curBalance);
    const pastM = Math.max(0, Math.min(out.months, fullMonths(join, NOW)));
    const past = pastM / 12;
    const left = Math.max(0, (out.months - pastM) / 12);

    const base = bal > 0 ? bal : (cur / 12) * past; // 현재 적립금 미입력 시 근사
    let fv = base * Math.pow(1 + r / 100, left);

    // 임금은 현재 → 퇴직시점까지 복리로 상승 (두 입력값에서 연평균 상승률 역산)
    const n = Math.ceil(left);
    const wageGrowth = n > 1 && cur > 0 && endA > 0 ? Math.pow(endA / cur, 1 / (n - 1)) - 1 : 0;

    let contribSum = 0;
    for (let i = 0; i < n; i++) {
      const span = Math.min(1, left - i);              // 마지막 해는 남은 기간만큼
      const wage = cur * Math.pow(1 + wageGrowth, i);  // i년차 연간임금총액
      const contrib = (wage / 12) * span;              // 그해 부담금
      contribSum += contrib;
      fv += contrib * Math.pow(1 + r / 100, left - i - span); // 연말 납입 → 그 뒤부터 복리
    }
    out.lump = fv;
    out.detail = { past, left, base, cur, endA, wageGrowth, contribSum, years: n };
  }
  return out;
}

/* ── 퇴직소득세 (소득세법 시행규칙 별지 제24호서식(2)) ───── */
// 기본세율 (과세표준 → 산출세액)
function baseTax(x) {
  if (x <= 14000000) return x * 0.06;
  if (x <= 50000000) return x * 0.15 - 1260000;
  if (x <= 88000000) return x * 0.24 - 5760000;
  if (x <= 150000000) return x * 0.35 - 15440000;
  if (x <= 300000000) return x * 0.38 - 19940000;
  if (x <= 500000000) return x * 0.4 - 25940000;
  if (x <= 1000000000) return x * 0.42 - 35940000;
  return x * 0.45 - 65940000;
}
// 근속연수공제
function serviceDeduction(y) {
  if (y <= 5) return y * 1000000;
  if (y <= 10) return 5000000 + (y - 5) * 2000000;
  if (y <= 20) return 15000000 + (y - 10) * 2500000;
  return 40000000 + (y - 20) * 3000000;
}
// 환산급여별 공제
function convDeduction(c) {
  if (c <= 8000000) return c;
  if (c <= 70000000) return 8000000 + (c - 8000000) * 0.6;
  if (c <= 100000000) return 45200000 + (c - 70000000) * 0.55;
  if (c <= 300000000) return 61700000 + (c - 100000000) * 0.45;
  return 151700000 + (c - 300000000) * 0.35;
}

const sDedRule = (y) =>
  y <= 5 ? "5년 이하 · 1년당 100만" :
  y <= 10 ? "6~10년 · 500만 + 초과 1년당 200만" :
  y <= 20 ? "11~20년 · 1,500만 + 초과 1년당 250만" :
  "20년 초과 · 4,000만 + 초과 1년당 300만";
const cDedRule = (c) =>
  c <= 8000000 ? "800만 이하 · 전액" :
  c <= 70000000 ? "800만~7천만 · 800만 + 초과 60%" :
  c <= 100000000 ? "7천만~1억 · 4,520만 + 초과 55%" :
  c <= 300000000 ? "1억~3억 · 6,170만 + 초과 45%" :
  "3억 초과 · 1억 5,170만 + 초과 35%";

function calcTax(t) {
  const s = D(t.startDate), e = D(t.endDate);
  const pay = toNum(t.pay);
  const nontax = toNum(t.nontax);
  const taxable = Math.max(0, pay - nontax); // (17) 과세대상 퇴직급여

  const months = s && e && e >= s ? fullMonths(s, e) : 0; // (22) 근속월수 — 만근 기준
  const adj = Math.max(0, months - toNum(t.exclude) + toNum(t.add));
  const years = adj > 0 ? Math.ceil(adj / 12) : 0; // (26) 근속연수 — 1년 미만 올림

  const sDed = years > 0 ? Math.min(serviceDeduction(years), taxable) : 0; // (28)
  const conv = years > 0 ? Math.floor(((taxable - sDed) * 12) / years) : 0; // (29) 환산급여
  const cDed = Math.floor(convDeduction(conv)); // (30)
  const base = Math.max(0, conv - cDed); // (31) 과세표준
  const convTax = Math.floor(baseTax(base)); // (32) 환산산출세액
  const gross = Math.floor((convTax / 12) * years); // (33) 산출세액
  const report = Math.max(0, gross - toNum(t.prepaid) - toNum(t.credit)); // (36) 신고대상세액

  const irpAmt = Math.min(toNum(t.irpAmount), taxable);
  const deferred = taxable > 0 ? Math.floor((report * irpAmt) / taxable) : 0; // (40) 이연퇴직소득세
  const withhold = Math.max(0, report - deferred); // (44) 차감원천징수세액
  const local = Math.floor(withhold / 10); // 지방소득세 10%
  const reportLocal = Math.floor(report / 10);

  return {
    taxable, months, adj, years, sDed, conv, cDed, base, convTax, gross, report,
    sDedRule: sDedRule(years), cDedRule: cDedRule(conv),
    irpAmt, deferred, withhold, local, reportLocal,
    total: withhold + local,
    effRate: taxable > 0 ? (report + reportLocal) / taxable : 0,
    saved: Math.floor(deferred * 0.3), // 연금 10년 이내 수령 시 30% 감면
  };
}

/* ── 연금수령연차 (소득세법 시행령 제40조의2) ─────────────── */
const PIVOT_2013 = new Date("2013-03-01T00:00:00");

function calcAnnuityYear(a, birthStr, refYear) {
  const open = D(a.open), start = D(a.start), birth = D(birthStr);
  const rpJoin = D(a.rpJoin); // 퇴직연금(DB/DC) 제도 가입일
  const year = Math.round(toNum(refYear));

  // 퇴직급여가 이체된 계좌는 퇴직연금 가입일을 그 계좌의 가입일로 봄
  const judge = a.fromSeverance && rpJoin && (!open || rpJoin < open) ? rpJoin : open;
  const bySeverance = !!(a.fromSeverance && rpJoin && open && rpJoin < open);

  const age55 = birth ? addYears(birth, 55) : null;   // 만 55세 도달일
  const fiveY = open ? addYears(open, 5) : null;      // 가입 후 5년
  const exempt = !!a.fromSeverance;                   // 퇴직급여 재원은 5년 요건 면제

  let firstOK = age55;
  if (age55 && fiveY && !exempt && fiveY > age55) firstOK = fiveY;

  // 요건 충족 전에 개시일을 잡아도 1년차는 요건 충족 시점부터
  const eff = start && firstOK ? (start > firstOK ? start : firstOK) : start || firstOK;
  const startYear = eff ? eff.getFullYear() : null;

  const base = judge && judge < PIVOT_2013 ? 6 : 1;       // 2013.3.1 이전 가입은 6년차부터
  const nth = startYear ? base + (year - startYear) : 0;  // 기준연도의 연금수령연차

  const value = toNum(a.value);
  const noLimit = nth >= 11;
  const limit = nth >= 1 && !noLimit ? (value / (11 - nth)) * 1.2 : 0;
  const cut = nth <= 10 ? 30 : nth <= 20 ? 40 : 50;       // 퇴직소득세 감면율

  return {
    firstOK, eff, startYear, base, nth, value, noLimit, limit, cut, judge, bySeverance,
    started: nth >= 1,
    y11: startYear ? startYear + (11 - base) : null,
    y21: startYear ? startYear + (21 - base) : null,
    delayed: !!(start && firstOK && firstOK > start),
  };
}

function calcPP(pp) {
  const start = D(pp.start);
  const bal = toNum(pp.balance);
  const yearly = toNum(pp.yearly);   // 연 납입액
  const r = toNum(pp.rate) / 100;    // 적립기간 수익률

  const left = start ? Math.max(0, yearsBetween(NOW, start)) : 0;
  const n = Math.ceil(left);

  let fv = bal * Math.pow(1 + r, left);     // 현재 적립금의 미래가치
  let contribSum = 0;
  for (let i = 0; i < n; i++) {
    const span = Math.min(1, left - i);
    const c = yearly * span;
    contribSum += c;
    fv += c * Math.pow(1 + r, left - i - span); // 연말 납입 → 그 뒤부터 복리
  }

  const payYears = toNum(pp.payYears) || 10;
  const ann = annuityCertain(fv, payYears, toNum(pp.payRate));
  const paidIn = bal + contribSum; // 내 돈: 현재 적립금 + 앞으로 낼 납입액

  return {
    start, left, years: n, fv, contribSum, paidIn,
    profit: fv - paidIn,
    balFV: bal * Math.pow(1 + r, left),
    monthly: ann.monthly, yearlyPay: ann.yearly,
    endDate: start ? addYears(start, payYears) : null,
  };
}

// 숫자만 치면 하이픈이 자동으로 붙는 날짜 입력 (연→월→일 자동 이동)
const maskDate = (raw) => {
  const d = String(raw).replace(/[^0-9]/g, "").slice(0, 8);
  let out = d.slice(0, 4);
  if (d.length > 4) out += "-" + d.slice(4, 6);
  if (d.length > 6) out += "-" + d.slice(6, 8);
  return out;
};
const isValidDate = (t) => {
  const d = t.replace(/[^0-9]/g, "");
  if (d.length !== 8) return false;
  const y = +d.slice(0, 4), m = +d.slice(4, 6), day = +d.slice(6, 8);
  if (m < 1 || m > 12 || day < 1) return false;
  const dt = new Date(y, m - 1, day);
  return dt.getFullYear() === y && dt.getMonth() === m - 1 && dt.getDate() === day;
};

function DateIn({ label, value, onChange, hint }) {
  const [draft, setDraft] = useState(null);
  const picker = useRef(null);
  const shown = draft !== null ? draft : value || "";

  const type = (raw) => {
    const t = maskDate(raw);
    setDraft(t);
    if (isValidDate(t)) {
      onChange(t);
      setDraft(null);
    }
  };
  const commit = () => {
    if (draft === null) return;
    if (draft === "") onChange("");
    else if (isValidDate(draft)) onChange(draft);
    setDraft(null); // 미완성 입력은 원래 값으로 되돌림
  };
  const openPicker = () => {
    const el = picker.current;
    if (!el) return;
    try { el.showPicker(); } catch (e) { el.focus(); }
  };

  return (
    <Field label={label} hint={hint}>
      <div className="flex items-center rounded-lg overflow-hidden" style={inputStyle}>
        <input
          className="w-full bg-transparent px-3 py-2.5 text-[15px] outline-none"
          inputMode="numeric"
          placeholder="YYYY-MM-DD"
          maxLength={10}
          value={shown}
          onChange={(e) => type(e.target.value)}
          onBlur={commit}
          onKeyDown={(e) => e.key === "Enter" && commit()}
          style={{ fontFamily: FONT_NUM, color: C.text }}
        />
        <button onClick={openPicker} className="px-2.5 py-2.5 shrink-0" aria-label="달력에서 고르기">
          <CalendarDays size={15} color={C.dim} />
        </button>
        <input
          ref={picker}
          type="date"
          tabIndex={-1}
          value={value || ""}
          onChange={(e) => { onChange(e.target.value); setDraft(null); }}
          style={{ position: "absolute", width: 1, height: 1, opacity: 0, pointerEvents: "none" }}
        />
      </div>
    </Field>
  );
}

          <Row k="앞으로 낼 부담금 합계" v={big(r.detail.contribSum || 0)} color={C.dim} sub={"매년 임금총액의 1/12 · " + (r.detail.years || 0) + "회"} />

      <Card title="연금으로 받을 계획" accent={C.f2}>

        <Rate label="적용이율" value={rp.payRate} onChange={(v) => set({ payRate: v })} hint="수령기간 동안 적립금에 붙는 이율" />

        <Note>보험연금 중 확정연금(정해진 기간 동안 나눠 받는 방식)을 기준으로 계산했어요. 매 회차 첫날 지급하는 기수불 복리 산식입니다.</Note>
        <Note>퇴직급여 계산은 법정 최소 기준이에요. 회사 규정(누진제·중간정산 이력)이 있으면 실제 금액과 달라질 수 있어요.</Note>
      </Card>

      <HelpBar onAsk={onAsk} placeholder="예: DB형과 DC형 중 뭐가 유리해요?" />
    </div>
  );
}

/* ── 시그니처: 연금 입면도 ────────────────────────────────── */
function Building({ floors, need }) {
  const total = floors.reduce((s, f) => s + f.amount, 0);
  const top = Math.max(total, need) * 1.18 || 1;
  const H = 210;
  const px = (v) => Math.max(v > 0 ? 26 : 0, (v / top) * H);
  const needY = (need / top) * H;

  return (
    <div className="relative pt-2" style={{ paddingRight: 8 }}>
      <div className="relative" style={{ height: H + 26 }}>
        {/* 필요생활비 기준선 */}
        <div className="absolute left-0 right-0 flex items-center" style={{ bottom: needY + 26, zIndex: 3 }}>
          <div className="flex-1" style={{ borderTop: "1px dashed " + C.warn }} />
          <span className="text-[10px] pl-2 whitespace-nowrap" style={{ color: C.warn, fontFamily: FONT_NUM }}>
            필요 {big(need)}
          </span>
        </div>
        {/* 층 */}
        <div className="absolute left-0 right-0 bottom-0 flex flex-col justify-end" style={{ height: H + 26 }}>
          <div className="flex flex-col">
            {floors.map((f) => (
              <div
                key={f.n}
                className="relative flex items-center justify-between px-3"
                style={{
                  height: px(f.amount),
                  background: f.amount > 0 ? f.color + "1a" : "transparent",
                  borderTop: "1px solid " + f.color,
                  borderLeft: "1px solid " + f.color + "66",
                  borderRight: "1px solid " + f.color + "66",
                  transition: "height 400ms ease",
                }}
              >
                <span className="text-[11px]" style={{ color: f.color }}>
                  <span style={{ fontFamily: FONT_NUM }}>{f.n}층</span> · {f.label}
                </span>
                <span className="text-[12px]" style={{ fontFamily: FONT_NUM, color: C.text }}>{won(f.amount)}</span>
              </div>
            ))}
          </div>
          {/* 지반선 */}
          <div style={{ height: 26, borderTop: "2px solid " + C.line2, background: "repeating-linear-gradient(115deg, rgba(21,44,82,0.18) 0 1px, transparent 1px 7px)" }} />
        </div>
      </div>
    </div>
  );
}

/* ── 화면 4 · 연금컨설팅 ──────────────────────────────────── */
function ScreenPlan({ st, set, onAsk }) {
  const np = calcNP(st.np);
  const rp = calcRP(st.rp);
  const irp = calcPP(st.pp);
  const birth = D(st.np.birth);
  const need = toNum(st.plan.need);
  const retireAge = toNum(st.plan.retireAge) || 60;

  const ageOf = (d) => (birth && d ? yearsBetween(birth, d) : null);
  const rpStart = Math.max(retireAge, 55);
  const rpYears = toNum(st.rp.payYears) || 10;
  const rpMonthly = annuityCertain(rp.lump, rpYears, toNum(st.rp.payRate)).monthly;

  const streams = [
    { key: "np", n: 1, label: "국민연금", color: C.f1, start: np.startAge, end: 200, monthly: np.eligible ? np.monthly : 0 },
    { key: "rp", n: 2, label: "퇴직연금", color: C.f2, start: rpStart, end: rpStart + rpYears, monthly: rpMonthly },
    { key: "irp", n: 3, label: "개인연금", color: C.f3, start: ageOf(irp.start) ?? 60, end: (ageOf(irp.start) ?? 60) + (toNum(st.pp.payYears) || 10), monthly: irp.monthly },
  ];

  // 구간 나누기
  const marks = [retireAge, 90];
  streams.forEach((s) => { [s.start, s.end].forEach((a) => { if (a > retireAge && a < 90) marks.push(a); }); });
  const pts = [...new Set(marks.map((m) => Math.round(m * 10) / 10))].sort((a, b) => a - b);
  const segs = [];
  for (let i = 0; i < pts.length - 1; i++) {
    const from = pts[i], to = pts[i + 1];
    if (to - from < 0.4) continue;
    const mid = (from + to) / 2;
    const parts = streams.filter((s) => mid >= s.start && mid < s.end && s.monthly > 0);
    const sum = parts.reduce((a, s) => a + s.monthly, 0);
    segs.push({ from, to, parts, sum, rate: need > 0 ? sum / need : 0 });
  }
  const worst = segs.length ? segs.reduce((a, b) => (a.rate <= b.rate ? a : b)) : null;
  const steady = segs.length ? segs.reduce((a, b) => (a.sum >= b.sum ? a : b)) : null;

  const floors = [
    { n: 3, label: "개인연금", color: C.f3, amount: (steady?.parts || []).filter((p) => p.n === 3).reduce((a, s) => a + s.monthly, 0) },
    { n: 2, label: "퇴직연금", color: C.f2, amount: (steady?.parts || []).filter((p) => p.n === 2).reduce((a, s) => a + s.monthly, 0) },
    { n: 1, label: "국민연금", color: C.f1, amount: (steady?.parts || []).filter((p) => p.n === 1).reduce((a, s) => a + s.monthly, 0) },
  ];

  // 처방
  const tips = [];
  if (worst && need > 0 && worst.sum < need) {
    const gap = need - worst.sum;
    const years = worst.to - worst.from;
    const accumYears = Math.max(0.5, (ageOf(irp.start) ?? 60) - yearsBetween(birth || NOW, NOW));
    const target = lumpFromMonthly(gap, years, toNum(st.pp.payRate));
    const addMonthly = monthlyToReach(target, accumYears, toNum(st.pp.rate));
    const tail = !worst.parts.some((p) => p.n === 3);
    if (tail) {
      tips.push({
        t: "개인연금 수령기간을 늘리거나 종신형을 섞기",
        d: "이 구간엔 국민연금만 남아요. 개인연금 수령기간을 30년으로 늘리면 월 수령액은 줄지만 공백이 사라져요. 사망할 때까지 나오는 종신형 연금보험을 일부 섞는 것도 방법이에요.",
      });
    }
    tips.push({
      t: "개인연금 월 납입액을 " + won(Math.ceil(addMonthly / 10000) * 10000) + " 늘리기",
      d: Math.round(worst.from) + "~" + Math.round(worst.to) + "세 구간의 부족액 " + won(gap) + "을 메우려면, 지금부터 " + accumYears.toFixed(0) + "년간 추가로 이만큼 넣어야 해요. (필요 재원 " + big(target) + ")",
    });
    const paid = toNum(st.pp.yearly) / 12;
    if (paid * 12 < 9000000) {
      tips.push({
        t: "세액공제 한도부터 채우기",
        d: "현재 연 " + big(paid * 12) + " 납입 중이에요. 연 900만원까지는 13.2~16.5%를 돌려받으니, 한도 안에서 늘리는 게 가장 수익률 높은 선택이에요.",
      });
    }
    if (np.startAge > worst.to - 0.5 && worst.from < np.startAge) {
      tips.push({
        t: "퇴직연금 수령기간을 " + Math.max(1, Math.round(np.startAge - rpStart)) + "년으로 조정",
        d: "은퇴 후 국민연금 개시 전까지가 소득 크레바스예요. 퇴직연금을 이 구간에 몰아서 받으면 공백을 메울 수 있어요. 다만 10년 미만이면 퇴직소득세 감면이 40%에서 30%로 줄어요.",
      });
    }
    tips.push({
      t: "은퇴 시점을 늦추거나 국민연금을 연기하기",
      d: "국민연금은 최대 5년 연기하면 1년당 7.2%, 총 36% 늘어나요. 퇴직 후 소득이 있다면 임의계속가입도 방법이에요.",
    });
  } else if (need > 0) {
    tips.push({ t: "목표 달성", d: "모든 구간에서 필요생활비를 넘겨요. 남는 여력은 의료비·간병비 대비나 인출 시점 분산에 쓰는 걸 권해요." });
  }

  return (
    <div>
      <ScreenHead eyebrow="STEP 4" title="연금 컨설팅" desc="1~3층을 쌓아 필요생활비 선에 닿는지 확인해요" color={C.text} />

      <Card title="기본 정보" accent={C.text}>
        <div className="grid grid-cols-2 gap-3">
          <Num label="예상 은퇴나이" value={st.plan.retireAge} onChange={(v) => set({ retireAge: v })} unit="세" />
          <Num label="월 필요생활비" value={st.plan.need} onChange={(v) => set({ need: v })} />
        </div>
      </Card>

      <Card
        title="층별 예상 월 수령액"
        accent={C.f1}
        tag={steady ? Math.round(steady.from) + "–" + Math.round(steady.to) + "세" : "—"}
      >
        <Building floors={floors} need={need} />
        <div className="mt-4">
          {floors.slice().reverse().map((f) => (
            <Row
              key={f.n}
              k={f.n + "층 · " + f.label}
              v={won(f.amount)}
              color={f.amount > 0 ? f.color : C.dim}
              sub={f.amount > 0 ? Math.round((f.amount / (steady?.sum || 1)) * 100) + "% 비중" : "이 구간엔 수령 없음"}
            />
          ))}
          <Row k="합계 월 수령액" v={won(steady?.sum || 0)} strong color={(steady?.sum || 0) >= need ? C.ok : C.warn} />
          <Row k="필요생활비 대비" v={Math.round((steady?.rate || 0) * 100) + "%"} sub={(steady?.sum || 0) >= need ? "충족" : "부족 " + won(need - (steady?.sum || 0))} />
        </div>
        <Note>세 층이 가장 두껍게 겹치는 구간이에요. 빨간 점선이 필요생활비, 건물 높이가 실제 수령액이에요.</Note>
      </Card>

      <Card title="나이대별 수령 흐름" accent={C.f2}>
        {segs.map((s, i) => {
          const okk = s.sum >= need;
          return (
            <div key={i} className="py-2.5" style={{ borderTop: "1px solid " + C.line }}>
              <div className="flex items-baseline justify-between mb-1.5">
                <span className="text-[13px]" style={{ fontFamily: FONT_NUM, color: C.text }}>
                  {Math.round(s.from)}–{Math.round(s.to)}세
                </span>
                <span className="text-[14px]" style={{ fontFamily: FONT_NUM, color: okk ? C.ok : C.warn }}>
                  {won(s.sum)} {okk ? "" : "· " + Math.round(s.rate * 100) + "%"}
                </span>
              </div>
              <div className="flex h-2 rounded-full overflow-hidden" style={{ background: "rgba(21,44,82,0.07)" }}>
                {s.parts.map((p, j) => (
                  <div key={j} style={{ width: (need > 0 ? Math.min(100, (p.monthly / need) * 100) : 0) + "%", background: p.color }} />
                ))}
              </div>
              <div className="mt-1.5 text-[11px]" style={{ color: C.dim }}>
                {s.parts.length ? s.parts.map((p) => p.label).join(" + ") : "수령 없음 — 소득 공백"}
              </div>
            </div>
          );
        })}
        <Note>막대는 필요생활비를 100%로 본 비율이에요. 색은 층 색과 같아요.</Note>
      </Card>

      <Card title="처방" accent={worst && worst.sum < need ? C.warn : C.ok}>
        <div className="flex items-center gap-2 mb-2">
          {worst && worst.sum < need
            ? <><AlertTriangle size={16} color={C.warn} /><span className="text-[14px]" style={{ color: C.warn }}>가장 취약한 구간: {Math.round(worst.from)}–{Math.round(worst.to)}세</span></>
            : <><Check size={16} color={C.ok} /><span className="text-[14px]" style={{ color: C.ok }}>전 구간 충족</span></>}
        </div>
        {tips.map((t, i) => (
          <div key={i} className="py-2.5" style={{ borderTop: "1px solid " + C.line }}>
            <div className="text-[14px] font-medium mb-1" style={{ color: C.text }}>{t.t}</div>
            <div className="text-[12px] leading-relaxed" style={{ color: C.dim }}>{t.d}</div>
          </div>
        ))}
      </Card>

function findAnswer(text) {
  const t = text.toLowerCase().replace(/\s/g, "");
  let best = null, score = 0;
  QA.forEach((item) => {
    let s = 0;
    item.k.forEach((k) => { if (t.includes(k.toLowerCase())) s += 2; });
    if (t.includes(item.q.slice(0, 6))) s += 3;
    if (s > score) { score = s; best = item; }
  });
  return score >= 2 ? best : null;
}

/* ── Supabase 연결 ───────────────────────────────────────── */
const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

const api = {
  async login(empNo, pw) {
    const { data, error } = await supabase.rpc("fn_login", { p_emp: empNo, p_pw: pw });
    return error ? { ok: false, error: "NETWORK" } : data;
  },
  async changePw(empNo, oldPw, newPw) {
    const { data, error } = await supabase.rpc("fn_change_pw", { p_emp: empNo, p_old: oldPw, p_new: newPw });
    return error ? { ok: false, error: "NETWORK" } : data;
  },
  async getNp() {
    const { data } = await supabase.rpc("fn_get_np");
    return data || null;
  },
  async adminUsers(adminPw) {
    const { data, error } = await supabase.rpc("fn_admin_users", { p_admin_pw: adminPw });
    if (error) return null;
    return data.map((u) => ({
      empNo: u.emp_id,
      active: u.is_active,
      isDefaultPw: u.is_default_pw,
      logins: u.login_count,
      lastLogin: u.last_login ? new Date(u.last_login).getTime() : null,
      never: u.login_count === 0,
      role: u.role || "sales",
      dept: u.dept || "미지정",
      title: u.title || "",
      sortNo: u.sort_no == null ? 9999 : u.sort_no,
    })).sort((a, b) => a.sortNo - b.sortNo || a.empNo.localeCompare(b.empNo));
  },
  async usage(adminPw, month) {
    const { data, error } = await supabase.rpc("fn_admin_usage", { p_admin_pw: adminPw, p_month: month });
    if (error) return null;
    const m = {};
    data.forEach((r) => { m[r.emp_id] = r.days; });
    return m;
  },
  async setActive(adminPw, empNo, active) {
    const { error } = await supabase.rpc("fn_admin_set_active", { p_admin_pw: adminPw, p_emp: empNo, p_active: active });
    return !error;
  },
  async resetPw(adminPw, empNo) {
    const { error } = await supabase.rpc("fn_admin_reset_pw", { p_admin_pw: adminPw, p_emp: empNo });
    return !error;
  },
  async saveNp(adminPw, value) {
    const { error } = await supabase.rpc("fn_admin_save_np", { p_admin_pw: adminPw, p_value: value });
    return !error;
  },
};

/* ── 새 버전 감지 ─────────────────────────────────────────
   배포된 index.html 의 ETag 를 주기적으로 확인해, 파일이 바뀌면 알려줍니다.
   버전 번호를 손으로 올릴 필요가 없어요.                        */
function useNewVersion() {
  const [stale, setStale] = useState(false);
  const base = useRef(null);

  useEffect(() => {
    let dead = false;
    const tagOf = async () => {
      try {
        const res = await fetch(location.href, { method: "HEAD", cache: "no-store" });
        return res.headers.get("etag") || res.headers.get("last-modified");
      } catch (e) { return null; }
    };
    const check = async () => {
      const t = await tagOf();
      if (dead || !t) return;
      if (base.current === null) base.current = t;
      else if (t !== base.current) setStale(true);
    };
    check();
    const timer = setInterval(check, 3 * 60 * 1000);
    const onFocus = () => { if (document.visibilityState === "visible") check(); };
    document.addEventListener("visibilitychange", onFocus);
    return () => { dead = true; clearInterval(timer); document.removeEventListener("visibilitychange", onFocus); };
  }, []);

  return stale;
}

/* ── 로그인 화면 ─────────────────────────────────────────── */
function Login({ onUser, onAdmin }) {
  const [empNo, setEmpNo] = useState("");
  const [pw, setPw] = useState("");
  const [adminPw, setAdminPw] = useState("");
  const [err, setErr] = useState("");
  const [busy, setBusy] = useState(false);

  const signIn = async () => {
    const id = empNo.trim();
    if (!id) { setErr("사번을 입력하세요."); return; }
    setBusy(true); setErr("");
    const res = await api.login(id, pw);
    setBusy(false);
    if (!res || !res.ok) {
      setErr(
        !res ? "연결에 실패했어요." :
        res.error === "NO_USER" ? "등록되지 않은 사번이에요. 관리자에게 문의하세요." :
        res.error === "INACTIVE" ? "비활성화된 계정이에요. 관리자에게 문의하세요." :
        res.error === "NETWORK" ? "연결에 실패했어요. 잠시 뒤 다시 시도해 주세요." :
        "비밀번호가 맞지 않아요."
      );
      return;
    }
    onUser({ empNo: res.empNo, isDefaultPw: res.isDefaultPw, logins: res.logins });
  };

  const signInAdmin = async () => {
    setBusy(true); setErr("");
    const rows = await api.adminUsers(adminPw);
    setBusy(false);
    if (!rows) { setErr("관리자 비밀번호가 맞지 않아요."); return; }
    onAdmin(adminPw, rows);
  };

  return (
    <div className="px-6 py-10">
      <div className="mb-8">
        <div className="text-[10px] tracking-[0.35em]" style={{ color: C.dim, fontFamily: FONT_NUM }}>PENSION CONSULTING</div>
        <h1 className="text-[26px] font-semibold leading-tight mt-1" style={{ color: C.text }}>3층 연금 설계</h1>
        <p className="text-[12.5px] mt-2" style={{ color: C.dim }}>사번 (숫자 5자리) · 초기 비밀번호 0000</p>
      </div>

      <Card accent={C.f1} title="사용자 로그인">
        <Field label="사번">
          <input
            className="w-full rounded-lg px-3 py-2.5 text-[15px] outline-none"
            style={{ ...inputStyle, textAlign: "left" }}
            value={empNo}
            placeholder="사번 입력"
            onChange={(e) => setEmpNo(e.target.value.replace(/[^0-9a-zA-Z]/g, ""))}
            onKeyDown={(e) => e.key === "Enter" && signIn()}
          />
        </Field>
        <Field label="비밀번호">
          <input
            type="password"
            className="w-full rounded-lg px-3 py-2.5 text-[15px] outline-none"
            style={{ ...inputStyle, textAlign: "left" }}
            value={pw}
            onChange={(e) => setPw(e.target.value)}
            onKeyDown={(e) => e.key === "Enter" && signIn()}
          />
        </Field>
        <button onClick={signIn} disabled={busy}
          className="w-full py-2.5 rounded-lg text-[14px] font-medium mt-1"
          style={{ background: C.f1, color: "#fff", opacity: busy ? 0.6 : 1 }}>
          {busy ? "확인 중…" : "로그인"}
        </button>
      </Card>

      <Card accent={C.dim} title="관리자 로그인">
        <Field label="관리자 비밀번호">
          <input
            type="password"
            className="w-full rounded-lg px-3 py-2.5 text-[15px] outline-none"
            style={{ ...inputStyle, textAlign: "left" }}
            value={adminPw}
            onChange={(e) => setAdminPw(e.target.value)}
            onKeyDown={(e) => e.key === "Enter" && signInAdmin()}
          />
        </Field>
        <button onClick={signInAdmin} disabled={busy}
          className="w-full py-2.5 rounded-lg text-[14px] font-medium"
          style={{ border: "1px solid " + C.line2, color: C.text }}>
          관리자 페이지 열기
        </button>
      </Card>

      {err && (
        <div className="rounded-xl px-3.5 py-3 text-[12.5px] flex gap-2" style={{ background: "rgba(217,45,69,0.07)", color: C.warn }}>
          <AlertTriangle size={14} className="shrink-0 mt-0.5" /> {err}
        </div>
      )}
    </div>
  );
}

/* ── 관리자 페이지 ───────────────────────────────────────── */
function AdminScreen({ adminPw, initialRows, onExit }) {
  const [rows, setRows] = useState(initialRows || null);
  const [cfg, setCfg] = useState(NP_DEFAULTS);
  const [msg, setMsg] = useState("");
  const [q, setQ] = useState("");
  const [month, setMonth] = useState(monthKey(new Date()));
  const [days, setDays] = useState(null);
  const [split, setSplit] = useState("dept");   // dept | role
  const [open, setOpen] = useState({ sales: true, staff: false });

  useEffect(() => {
    (async () => {
      const c = await api.getNp();
      if (c) setCfg({ ...NP_DEFAULTS, ...c });
      if (!initialRows) setRows(await api.adminUsers(adminPw));
    })();
  }, []);

  useEffect(() => {
    setDays(null);
    (async () => setDays(await api.usage(adminPw, month)))();
  }, [month]);

  const update = async (u, patch) => {
    const ok = "active" in patch
      ? await api.setActive(adminPw, u.empNo, patch.active)
      : await api.resetPw(adminPw, u.empNo);
    if (ok) setRows((r) => r.map((x) => (x.empNo === u.empNo ? { ...x, ...patch } : x)));
  };

  const saveCfg = async () => {
    const ok = await api.saveNp(adminPw, cfg);
    setMsg(ok ? "저장했어요. 사용자 화면에 바로 반영됩니다." : "저장에 실패했어요.");
    setTimeout(() => setMsg(""), 3000);
  };

  const total = rows ? rows.length : 0;
  const active = rows ? rows.filter((r) => r.active).length : 0;
  const joined = rows ? rows.filter((r) => !r.never).length : 0;
  const logins = rows ? rows.reduce((a, r) => a + (r.logins || 0), 0) : 0;
  const withDays = (rows || []).map((r) => ({ ...r, days: (days && days[r.empNo]) || 0 }));
  const sales = withDays.filter((r) => r.role === "sales");
  const staff = withDays.filter((r) => r.role === "staff");

  // 활용률 = 월 4일 이상 사용한 영업담당자 ÷ 전체 영업담당자 × 50%
  const heavy = sales.filter((r) => r.days >= 4).length;
  const rate = sales.length ? (heavy / sales.length) * 100 : 0;

  const summarize = (list) => {
    const n = list.length;
    const h = list.filter((r) => r.days >= 4).length;
    const u = list.filter((r) => r.days > 0).length;
    return { n, h, u, pct: n ? (h / n) * 100 : 0 };
  };
  const byDept = [...new Set(withDays.map((r) => r.dept))].sort()
    .map((d) => ({ key: d, ...summarize(withDays.filter((r) => r.dept === d)) }));
  const byRole = [
    { key: "영업담당자", ...summarize(sales) },
    { key: "스탭", ...summarize(staff) },
  ];

  const shown = withDays.filter((r) => !q || r.empNo.includes(q.trim()) || (r.dept || "").includes(q.trim()));
  const groups = [
    { key: "sales", label: "영업담당자", list: shown.filter((r) => r.role === "sales") },
    { key: "staff", label: "스탭", list: shown.filter((r) => r.role === "staff") },
  ];

  return (
    <div className="px-5 py-5" style={{ paddingBottom: 40 }}>
      <header className="flex items-start justify-between mb-4 pb-3" style={{ borderBottom: "1px dashed " + C.line2 }}>
        <div>
          <div className="text-[10px] tracking-[0.25em]" style={{ color: C.dim, fontFamily: FONT_NUM }}>ADMIN</div>
          <h2 className="text-[21px] font-semibold leading-tight" style={{ color: C.text }}>관리자 페이지</h2>
          <div className="text-[10px] mt-0.5" style={{ color: C.faint, fontFamily: FONT_NUM }}>{BUILD}</div>
        </div>
        <button onClick={onExit} className="text-[12px] px-3 py-1.5 rounded-lg" style={{ border: "1px solid " + C.line2, color: C.text }}>
          나가기
        </button>
      </header>

      <Card title="활용률" accent={C.f1} tag={month}>
        <div className="flex items-center justify-between mb-3">
          <button onClick={() => setMonth(shiftMonth(month, -1))} className="px-3 py-1.5 rounded-lg text-[12px]" style={{ border: "1px solid " + C.line2, color: C.text }}>← 이전</button>
          <span className="text-[14px] font-medium" style={{ color: C.text, fontFamily: FONT_NUM }}>{month}</span>
          <button
            onClick={() => setMonth(shiftMonth(month, 1))}
            disabled={month >= monthKey(new Date())}
            className="px-3 py-1.5 rounded-lg text-[12px]"
            style={{ border: "1px solid " + C.line2, color: C.text, opacity: month >= monthKey(new Date()) ? 0.35 : 1 }}
          >다음 →</button>
        </div>

        <div className="rounded-xl px-4 py-3 mb-3" style={{ background: C.panel2 }}>
          <div className="text-[11px] mb-1" style={{ color: C.dim }}>월 4일 이상 사용한 영업담당자 ÷ 전체 영업담당자 × 50%</div>
          <div className="flex items-baseline gap-2">
            <span className="text-[30px] font-semibold" style={{ color: C.f1 }}>{days ? (rate / 2).toFixed(1) : "—"}</span>
            <span className="text-[15px]" style={{ color: C.dim }}>/ 50점</span>
          </div>
          <div className="text-[11.5px] mt-1" style={{ color: C.dim }}>
            {days ? heavy + "명 / " + sales.length + "명 · 달성 " + rate.toFixed(1) + "%" : "불러오는 중…"}
          </div>
          <div className="h-2 rounded-full overflow-hidden mt-2" style={{ background: "rgba(21,44,82,0.07)" }}>
            <div style={{ width: Math.min(100, rate) + "%", height: "100%", background: C.f1, transition: "width 400ms ease" }} />
          </div>
        </div>

        <div className="flex gap-1.5 mb-3">
          {[["dept", "부서별"], ["role", "분류별"]].map(([k, label]) => (
            <button key={k} onClick={() => setSplit(k)}
              className="flex-1 py-1.5 rounded-lg text-[12px]"
              style={split === k
                ? { background: C.f1, color: "#fff" }
                : { border: "1px solid " + C.line2, color: C.dim }}>
              {label}
            </button>
          ))}
        </div>

        {(split === "dept" ? byDept : byRole).map((g) => (
          <div key={g.key} className="py-2" style={{ borderTop: "1px solid " + C.line }}>
            <div className="flex items-baseline justify-between mb-1.5">
              <span className="text-[12.5px]" style={{ color: C.text }}>{g.key}</span>
              <span className="text-[12px]" style={{ fontFamily: FONT_NUM, color: g.pct >= 50 ? C.ok : C.text }}>
                {g.h}/{g.n}명 · {g.pct.toFixed(0)}%
              </span>
            </div>
            <div className="h-2 rounded-full overflow-hidden" style={{ background: "rgba(21,44,82,0.07)" }}>
              <div style={{ width: Math.min(100, g.pct) + "%", height: "100%", background: g.pct >= 50 ? C.ok : C.f1 }} />
            </div>
          </div>
        ))}
        <Note>
          {split === "dept"
            ? "부서별은 분류와 상관없이 그 부서 전원을 기준으로 계산했어요."
            : "활용률 점수는 영업담당자만 대상이에요. 스탭은 참고용입니다."}
        </Note>
      </Card>

      <Card title="국민연금 가정값" accent={C.f1} tag="전체 적용">
        <Num label="A값 (전체 가입자 평균소득월액)" value={cfg.aValue} onChange={(v) => setCfg({ ...cfg, aValue: v })} />
        <div className="grid grid-cols-2 gap-3">
          <Num label="기준소득월액 상한" value={cfg.cap} onChange={(v) => setCfg({ ...cfg, cap: v })} />
          <Num label="기준소득월액 하한" value={cfg.floor} onChange={(v) => setCfg({ ...cfg, floor: v })} />
        </div>
        <Rate label="예상 소득상승률 (연)" value={cfg.growth} onChange={(v) => setCfg({ ...cfg, growth: v })} hint="공단 조회값과 대조할 때 쓰는 값이에요" />
        <button onClick={saveCfg} className="w-full py-2.5 rounded-lg text-[14px] font-medium mt-1" style={{ background: C.f1, color: "#fff" }}>
          저장
        </button>
        {msg && <div className="text-[12px] mt-2" style={{ color: C.ok }}>{msg}</div>}
        <Note>매년 7월 고시된 값으로 갱신하면 모든 사용자 화면에 함께 반영돼요.</Note>
      </Card>

      <Card title="계정 관리" accent={C.f2} tag={total + "명"}>
        <input
          className="w-full rounded-lg px-3 py-2 text-[13px] outline-none mb-3"
          style={{ ...inputStyle, textAlign: "left" }}
          placeholder="사번 또는 부서 검색"
          value={q}
          onChange={(e) => setQ(e.target.value)}
        />
        {rows === null && <div className="text-[12.5px] py-3" style={{ color: C.dim }}>불러오는 중…</div>}

        {groups.map((g) => (
          <div key={g.key} style={{ borderTop: "1px solid " + C.line }}>
            <button
              onClick={() => setOpen((o) => ({ ...o, [g.key]: !o[g.key] }))}
              className="w-full flex items-center justify-between py-3"
            >
              <span className="flex items-center gap-2">
                <ChevronDown size={15} color={C.dim} style={{ transform: open[g.key] ? "none" : "rotate(-90deg)", transition: "transform 150ms" }} />
                <span className="text-[14px] font-medium" style={{ color: C.text }}>{g.label}</span>
                <span className="text-[10px] px-1.5 py-0.5 rounded-full"
                  style={{ color: g.key === "sales" ? C.f1 : C.dim, border: "1px solid " + (g.key === "sales" ? C.f1 : C.line2) + "66" }}>
                  {g.key === "sales" ? "측정 대상" : "측정 제외"}
                </span>
              </span>
              <span className="text-[12px]" style={{ color: C.dim }}>{g.list.length}명</span>
            </button>

            {open[g.key] && g.list.map((u) => (
              <div key={u.empNo} className="py-3 pl-2" style={{ borderTop: "1px solid " + C.line }}>
                <div className="flex items-center justify-between mb-1">
                  <div className="flex items-center gap-2">
                    <span className="text-[15px] font-medium" style={{ color: C.text, fontFamily: FONT_NUM }}>{u.empNo}</span>
                    <span className="text-[11.5px]" style={{ color: C.dim }}>{u.dept} · {u.title}</span>
                  </div>
                  <span className="text-[10px] px-1.5 py-0.5 rounded-full"
                    style={{ color: u.active ? C.ok : C.warn, border: "1px solid " + (u.active ? C.ok : C.warn) + "66" }}>
                    {u.active ? "활성" : "비활성"}
                  </span>
                </div>
                <div className="text-[11px] mb-2" style={{ color: C.faint }}>
                  {stamp(u.lastLogin)} · 로그인 {u.logins || 0}회{days ? " · " + month + " " + u.days + "일 사용" : ""}
                  {u.never ? " · 미접속" : ""}{!u.never && u.isDefaultPw ? " · 초기 비번" : ""}
                </div>
                <div className="flex gap-2">
                  <button onClick={() => update(u, { active: !u.active })} className="flex-1 py-1.5 rounded-lg text-[12px]"
                    style={{ border: "1px solid " + (u.active ? C.warn : C.ok), color: u.active ? C.warn : C.ok }}>
                    {u.active ? "비활성화" : "활성화"}
                  </button>
                  <button onClick={() => update(u, { isDefaultPw: true })} className="flex-1 py-1.5 rounded-lg text-[12px]"
                    style={{ border: "1px solid " + C.line2, color: C.text }}>
                    비밀번호 초기화
                  </button>
                </div>
              </div>
            ))}
          </div>
        ))}
      </Card>
    </div>
  );
}

        <button onClick={() => setSt((x) => ({ ...INIT, app: x.app }))} className="ml-auto flex items-center gap-1 text-[11px] shrink-0" style={{ color: C.dim }}>
          <RotateCcw size={11} /> 예시값
        </button>
      </div>

      <main ref={scrollRef} className="relative flex-1 overflow-y-auto px-5 py-5" style={{ paddingBottom: 96 }}>
        {showPw && <PasswordCard user={me} onDone={(u) => { setAuth({ type: "user", user: u }); setShowPw(false); }} />}
        {tab === "np" && <ScreenNP np={st.np} set={patch("np")} onAsk={ask} />}
        {tab === "rp" && <ScreenRP rp={st.rp} set={patch("rp")} onAsk={ask} />}
        {tab === "pp" && <ScreenPP pp={st.pp} set={patch("pp")} onAsk={ask} />}
        {tab === "plan" && <ScreenPlan st={st} set={patch("plan")} onAsk={ask} />}
        {tab === "tax" && <ScreenTax tax={st.tax} set={patch("tax")} rp={st.rp} onAsk={ask} />}
        {tab === "yr" && <ScreenAnnuity tax={st.tax} set={patch("tax")} setAnn={patchAnn} np={st.np} onAsk={ask} />}
        {tab === "chat" && <ScreenChat log={chatLog} setLog={setChatLog} pending={pending} clearPending={() => setPending(null)} />}
      </main>

      <nav className="fixed bottom-0 w-full max-w-md flex" style={{ background: "rgba(255,255,255,0.93)", borderTop: "1px solid " + C.line, backdropFilter: "blur(8px)" }}>
        {TABS.map((t) => {
          const on = tab === t.id;
          return (
            <button key={t.id} onClick={() => setTab(t.id)} className="flex-1 flex flex-col items-center gap-1 py-2.5"
              style={{ borderTop: on ? "2px solid " + t.color : "2px solid transparent", marginTop: -1 }}>
              <t.Icon size={16} color={on ? t.color : C.dim} strokeWidth={on ? 2.2 : 1.6} />
              <span className="flex flex-col items-center leading-tight text-center" style={{ fontSize: 9, color: on ? t.color : C.dim }}>
                <span>{t.label}</span>
                {t.label2 && <span>{t.label2}</span>}
              </span>
            </button>
          );
        })}
      </nav>
    </>
  );
}

if (!SUPABASE_URL || !SUPABASE_KEY || SUPABASE_URL.includes("여기에")) {
  document.getElementById("root").innerHTML =
    '<div style="font-family:system-ui;padding:40px 24px;color:#16233A;line-height:1.7">' +
    '<b>config.js 를 설정해 주세요.</b><br><br>' +
    '저장소에 config.js 파일이 없거나, 안의 주소와 키가 채워지지 않았어요.</div>';
} else {
  createRoot(document.getElementById("root")).render(<PensionConsulting />);
}

</script>
</body>
</html>
